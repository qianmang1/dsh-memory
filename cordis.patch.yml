# The layer a profile applies when it lists this bundle: five insert rows, one
# per independently toggleable component — the plugin page renders one switch
# per row, and toggling a row starts or stops exactly that component.
#
# memory-debug mounts first so the boot reporter exists before the siblings
# report their own mount lines. Deployment-varying values live in each row's
# config; the API key is resolved through ctx.credentials, never written here.
# `pendingDir` must stay identical across capture / review / core / debug (all
# default to $DSH_HOME/memory-pending; core needs it since memory_remember
# started submitting to the queue).
#
# The bare `dsh-memory` row is NOT a ninth component: the web client-module
# scanner only resolves client halves from loader rows named as a bare package
# specifier, so this inert portal row (src/portal.ts — mounts nothing) is what
# pulls lib/client.js into the browser boot graph. Without it the sidebar tab
# never loads.
- insert:
    - id: memory-debug
      name: dsh-memory/debug
      config:
        debugLog: false
        pendingDir: ''
    - id: memory-core
      name: dsh-memory/core
      config:
        baseUrl: ''
        userId: ''
        pendingDir: ''
    - id: memory-recall
      name: dsh-memory/recall
      config:
        baseUrl: ''
        userId: ''
        brief: true
        recall: true
    - id: memory-capture
      name: dsh-memory/capture
      config:
        pendingDir: ''
        captureThreshold: 0.6
        maxPerTurn: 5
        pendingTtlDays: 7
    - id: memory-review
      name: dsh-memory/review
      config:
        baseUrl: ''
        userId: ''
        pendingDir: ''
        dedupeThreshold: 0.8
    - id: memory-root
      name: dsh-memory
